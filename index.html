<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pase Azul | CUA CUA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="azul">
  <section class="landing">
    <img src="assets/logo.svg" alt="CUA CUA" class="logo">
    <h1>LA AVENTURA TE ESPERA</h1>
    <p>Escanea. Registra. Disfruta.</p>
    <button id="comenzar">COMENZAR</button>
  </section>

  <section class="validacion hidden">
    <h2>Introduce el código de tu boleto</h2>
    <input type="text" id="codigo" placeholder="AZ-_____" maxlength="8">
    <button id="validar">VALIDAR</button>
    <p id="mensaje"></p>
  </section>

  <!-- Librería de confeti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
